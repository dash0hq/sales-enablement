<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booth Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Dash0 brand: Salmon #FD8C66, Alabaster #FAFAFA, Cod Gray #101010 */
  --bg:#FAFAFA; --card:#FFFFFF; --ink:#101010; --muted:#5C5C5C; --line:#E2E2E2;
  --accent:#FD8C66; --accent-ink:#101010; --soft:#F1F1F1; --link:#B8431B; --focus:#101010;
  --good:#0F7A43; --good-bg:#E1F4E9; --mid:#8F5A00; --mid-bg:#FBEFD5; --bad:#B3261E; --bad-bg:#FBE4E4;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101010; --card:#1A1A1A; --ink:#FAFAFA; --muted:#A9A9A9; --line:#2E2E2E;
    --accent:#FD8C66; --accent-ink:#101010; --soft:#222222; --link:#FD8C66; --focus:#FD8C66;
    --good:#5FD39A; --good-bg:#12291F; --mid:#F0BE5A; --mid-bg:#2E2510; --bad:#FF7A7A; --bad-bg:#331717;
  }
}
:root[data-theme="dark"]{
  --bg:#101010; --card:#1A1A1A; --ink:#FAFAFA; --muted:#A9A9A9; --line:#2E2E2E;
  --accent:#FD8C66; --accent-ink:#101010; --soft:#222222; --link:#FD8C66; --focus:#FD8C66;
  --good:#5FD39A; --good-bg:#12291F; --mid:#F0BE5A; --mid-bg:#2E2510; --bad:#FF7A7A; --bad-bg:#331717;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:14px}
.logo{display:block;height:22px;width:auto;color:var(--ink)}
.brandwrap .brand{padding-left:14px;border-left:1px solid var(--line);font-size:19px}
@media (max-width:480px){.logo{height:18px}.brandwrap{gap:10px}.brandwrap .brand{padding-left:10px;font-size:17px}}
.brand{font-family:var(--display);font-weight:700;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:500}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.hero h1{font-size:clamp(34px,7vw,52px);margin-bottom:12px}
.hero p{color:var(--muted);margin:0 0 20px;max-width:56ch}
.field{margin:18px 0}
.field > .lab{font-weight:600;margin-bottom:8px;display:block}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font:inherit}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.names{grid-template-columns:1fr}}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 22px;font-weight:600;font-size:17px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.turn{color:var(--muted);font-size:15px;margin-bottom:6px}
.persona{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:14px;font-weight:500;margin-bottom:12px}
.says{border-left:5px solid var(--accent);background:var(--soft);border-radius:0 14px 14px 0;padding:16px 18px;margin:6px 0 18px;font-size:19px}
.scene{display:block;color:var(--muted);font-size:15px;font-style:italic;margin-bottom:8px}
.says small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.q{font-size:26px;margin-bottom:14px}
.hint{color:var(--muted);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:15px}
.opt.t2{border-color:var(--good);background:var(--good-bg)}
.opt.t1{border-color:var(--mid);background:var(--mid-bg)}
.opt.t0{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{box-shadow:0 0 0 3px var(--accent)}
.opt:disabled{cursor:default}
.tag{display:block;font-size:14px;font-weight:600;margin-top:6px}
.t2 .tag{color:var(--good)} .t1 .tag{color:var(--mid)} .t0 .tag{color:var(--bad)}
.opt .txt{flex:1}
.opt .why{display:block;font-size:15px;color:var(--muted);margin-top:4px}
.model{margin-top:16px;border:1px dashed var(--line);border-radius:14px;padding:14px 16px}
.model b{display:block;margin-bottom:4px}
.pts{font-family:var(--display);font-size:20px;margin:16px 0 4px}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.score-big{font-family:var(--display);font-size:clamp(48px,12vw,84px);line-height:1}
.rank{font-family:var(--display);font-size:26px;margin:8px 0 4px}
table{width:100%;border-collapse:collapse;margin:14px 0}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:16px}
th{font-weight:600;color:var(--muted)}
.miss{background:var(--soft);border-radius:14px;padding:14px 16px;margin:10px 0}
.miss q{display:block;font-weight:600;margin-bottom:4px;quotes:none}
.podium{display:grid;gap:8px;margin:14px 0}
.pl{display:flex;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 16px;font-weight:500}
.pl.win{outline:2px solid var(--good)}
.docs{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.docs a{display:block;margin-top:6px}
.model a{color:var(--link);font-weight:500;word-break:break-word}
.note{color:var(--muted);font-size:15px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
var SCENARIOS = [
  {
    "attendee": "\"How are you better than Datadog? We already send OpenTelemetry data to them.\"",
    "options": [
      {

  {
    "attendee": "\"We use Dynatrace enterprise-wide. Their OneAgent does everything automatically, why would we care about Dash0?\"",

  {
    "attendee": "\"We send our telemetry to New Relic via OTLP. Isn't that the exact same thing as what Dash0 does?\"",

        "t": "New Relic accepts OTLP, but it stores your data in its own database (NRDB) and you query it with NRQL. Dash0 keeps your data native to OpenTelemetry and supports open query languages like PromQL and SQL. When your data stays standard, you keep context and you don't build vendor-locked query skills.",

  {
    "attendee": "\"We built our logging and trace pipeline on Elasticsearch, Logstash, and Kibana. What makes Dash0 better?\"",
    "options": [
      {
        "t": "If you run ELK yourselves, mappings, cluster scaling, and index lifecycles become a job of their own. Elastic does offer a managed cloud and supports OpenTelemetry too, so I'd start with what hurts: running it, the cost, or finding things. Dash0 is fully managed and OpenTelemetry-native, with logs, metrics, and traces in one place.",

  {
    "attendee": "\"We're looking at SigNoz because it's open source and built on OpenTelemetry. Why Dash0 instead?\"",
    "options": [
      {
        "t": "SigNoz is a solid open source project, and it's OpenTelemetry-native too, with both a self-hosted edition and a managed cloud. If open source and self-hosting matter most, that's a real option. Dash0 is a managed platform, with SignalControl to cut telemetry volume, continuous profiling, and Agent0 and Darkplane for AI workflows.",

      {
        "t": "Dash0 has way more features and a better interface than SigNoz.",

        "label": "Dash0 vs SigNoz",

  {
    "attendee": "\"We love Honeycomb for tracing. Why should we consider Dash0?\"",
    "options": [
      {
        "t": "Honeycomb is fantastic for deep, high-cardinality trace analysis, and it now supports logs and metrics too. Dash0's angle is open standards you already know, like PromQL and Perses, pricing by signal, and Agent0 for incident investigation. What matters most to your team?",
        "tier": 2

        "t": "Honeycomb is too niche for a full observability platform.",

        "t": "Honeycomb doesn't support logs or metrics.",

  {
    "attendee": "\"Our security and operations teams live in Splunk. Why would we add Dash0?\"",

  {
    "attendee": "\"How hard is it to deploy Dash0 across our 50 Kubernetes clusters?\"",

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var setup = { mode:"solo", n1:"", n2:"" };

function renderStart(){
  var pair = setup.mode === "pair";
  app.innerHTML =
    '<div class="top">' + BRAND + '</div>' +
    '<div class="card hero">' +
      '<h1>Practice the real booth conversations before you are in them.</h1>' +
      '<p>' + SCENARIOS.length + ' booth questions on Dash0, OpenTelemetry, competitors, and what each persona cares about. Say your answer out loud first, then check it. Each best answer earns 10 points, partly right answers earn 5, and back to back best answers add a streak bonus.</p>' +
      '<div class="field"><div class="seg" role="group" aria-label="Mode">' +
        '<button data-mode="solo" aria-pressed="' + (!pair) + '">Solo</button>' +
        '<button data-mode="pair" aria-pressed="' + pair + '">Pair (take turns)</button></div></div>' +
      (pair ? '<div class="field"><div class="names">' +
        '<input type="text" id="n1" placeholder="Player 1" value="' + esc(setup.n1) + '" aria-label="Player 1 name">' +
        '<input type="text" id="n2" placeholder="Player 2" value="' + esc(setup.n2) + '" aria-label="Player 2 name"></div>' +
        '<p class="hint" style="margin-top:8px">Your partner reads the attendee line out loud, and you answer. Turns alternate.</p></div>' : '') +
      '<button class="primary" id="go">Start</button>' +
    '</div>';
  app.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick=function(){ readNames(); setup.mode=b.dataset.mode; renderStart(); }; });
  document.getElementById("go").onclick = function(){ readNames(); startGame(); };
}
function readNames(){
  var a = document.getElementById("n1"), b = document.getElementById("n2");
  if (a) setup.n1 = a.value; if (b) setup.n2 = b.value;
}

function startGame(){
  var pair = setup.mode === "pair";
  var players = pair
    ? [{name:(setup.n1.trim()||"Player 1"),score:0,best:0,streak:0,played:0},{name:(setup.n2.trim()||"Player 2"),score:0,best:0,streak:0,played:0}]
    : [{name:"You",score:0,best:0,streak:0,played:0}];
  S = { pair:pair, players:players, order:shuffle(SCENARIOS.map(function(_,i){return i;})),
        i:0, phase:"prompt", opts:null, chosen:null, last:null, log:[] };
  renderPlay();
}

function chipsHtml(){
  var cur = S.pair ? S.i % 2 : 0;
  return '<div class="chips">' + S.players.map(function(p,idx){
    return '<span class="chip ' + (S.pair && idx===cur ? 'on' : '') + '">' + esc(p.name) + ': ' + p.score + (p.streak>1 ? ' (streak ' + p.streak + ')' : '') + '</span>';
  }).join('') + '</div>';
}

function renderPlay(){
  var sc = SCENARIOS[S.order[S.i]];
  var cur = S.pair ? S.i % 2 : 0;
  var p = S.players[cur];
  var total = S.order.length;
  var h = '<div class="top">' + BRAND + '' + chipsHtml() + '</div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + S.i + '"><i style="width:' + (S.i/total*100) + '%"></i></div>' +
    '<div class="card">' +
        '<div class="says">' + (sc.scene ? '<span class="scene">' + esc(sc.scene) + '</span>' : '') + esc(sc.attendee) + '</div>' +
    '<h2 class="q">' + esc(sc.question || "What do you say?") + '</h2>';

  if (S.phase === "prompt"){
    h += '<p class="hint">Say your answer out loud first. Then check it against the options.</p>' +
         '<button class="primary" id="reveal">I said it, show options</button>';
  } else {
    var letters = ["A","B","C"];
    h += '<div class="opts" id="opts">' + S.opts.map(function(o,idx){
      var done = S.phase === "result";
      var cls = "opt" + (done ? " t" + o.tier : "") + (done && S.chosen===idx ? " picked" : "");
      var tag = done ? (o.tier===2 ? "Best answer" : o.tier===1 ? "Partly right" : "Wrong answer") : "";
      return '<button class="' + cls + '" data-i="' + idx + '"' + (done ? ' disabled' : '') + '>' +
        '<span class="k">' + letters[idx] + '</span><span class="txt">' + esc(o.t) +
        (done ? '<span class="tag">' + tag + '</span>' : '') + '</span></button>';
    }).join('') + '</div>';
    if (S.phase === "result"){
      var L = S.last;
      h += '<div aria-live="polite"><div class="pts">+' + L.pts + ' points' + (L.bonus ? ' (includes ' + L.bonus + ' streak bonus)' : '') + '</div></div>' +
           '<div class="model"><b>Learn</b>' + esc(sc.learn) +
             (sc.docs ? '<div class="docs"><b>Documentation</b>' + (Array.isArray(sc.docs) ? sc.docs : [sc.docs]).map(function(d){ return '<a href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.label) + '</a>'; }).join('') + '</div>' : '') +
           '</div>' +
           '<div class="actions"><button class="primary" id="next">' + (S.i+1 >= total ? 'See results' : 'Next round') + '</button></div>';
    }
  }
  h += '</div><div class="actions"><button class="ghost" id="finish">Finish now</button></div>';
  app.innerHTML = h;
  window.scrollTo(0,0);

  var fin = document.getElementById("finish");
  if (fin) fin.onclick = function(){ if (S.log.length) { renderEnd(); } else { renderStart(); } };
  var rv = document.getElementById("reveal");
  if (rv) rv.onclick = function(){ S.opts = shuffle(sc.options); S.phase = "options"; renderPlay(); };
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){ choose(parseInt(b.dataset.i,10)); };
  });
  var nx = document.getElementById("next");
  if (nx) nx.onclick = function(){
    S.i++;
    if (S.i >= S.order.length) { renderEnd(); }
    else { S.phase = "prompt"; S.opts = null; S.chosen = null; S.last = null; renderPlay(); }
  };
}

function choose(idx){
  var cur = S.pair ? S.i % 2 : 0;
  var p = S.players[cur];
  var o = S.opts[idx];
  var pts = 0, bonus = 0;
  if (o.tier === 2){
    p.streak++; p.best++;
    bonus = Math.min(p.streak - 1, 3) * 2;
    pts = 10 + bonus;
  } else {
    p.streak = 0;
    pts = o.tier === 1 ? 5 : 0;
  }
  p.score += pts; p.played++;
  S.chosen = idx; S.phase = "result"; S.last = {pts:pts, bonus:bonus};
  S.log.push({sc:SCENARIOS[S.order[S.i]], tier:o.tier, player:cur});
  renderPlay();
}

function renderEnd(){
  var total = S.order.length;
  var h = '<div class="top">' + BRAND + '</div><div class="card">';
  if (S.pair){
    var ps = S.players.slice().sort(function(a,b){return b.score-a.score;});
    var tie = ps[0].score === ps[1].score;
    h += '<h2>' + (tie ? 'It is a tie' : esc(ps[0].name) + ' wins') + '</h2><div class="podium">' +
      ps.map(function(p){ return '<div class="pl' + (!tie && p===ps[0] ? ' win' : '') + '"><span>' + esc(p.name) + '</span><span>' + p.score + ' points, ' + p.best + ' best answers</span></div>'; }).join('') + '</div>';
  } else {
    var p = S.players[0];
    var share = p.best / (p.played || 1);
    var rank = share >= 0.9 ? "Booth lead" : share >= 0.7 ? "Conversation ready" : share >= 0.4 ? "Warming up" : "Keep practicing";
    var prev = getBest(), isNew = p.score > prev;
    if (isNew) setBest(p.score);
    h += '<div class="score-big">' + p.score + '</div><div class="rank">' + rank + '</div>' +
         '<p class="hint">' + p.best + ' of ' + p.played + ' best answers' + (isNew ? '. New personal best.' : '. Personal best: ' + prev + '.') + '</p>';
  }

  var by = {};
  S.log.forEach(function(e){ var k = e.sc.persona; by[k] = by[k] || {n:0,b:0}; by[k].n++; if (e.tier===2) by[k].b++; });
  h += '<table><thead><tr><th>Persona</th><th>Best answers</th></tr></thead><tbody>' +
    Object.keys(by).map(function(k){ return '<tr><td>' + esc(k) + '</td><td>' + by[k].b + ' of ' + by[k].n + '</td></tr>'; }).join('') + '</tbody></table>';

  var missed = S.log.filter(function(e){ return e.tier !== 2; });
  if (missed.length){
    h += '<h3 style="margin-top:20px">Worth another look</h3>' + missed.map(function(e){
      return '<div class="miss"><q>' + esc(e.sc.attendee) + '</q>' + esc(bestText(e.sc)) + '</div>';
    }).join('');
  } else {
    h += '<p class="hint">No misses this round.</p>';
  }
  h += '<div class="actions"><button class="primary" id="again">Play again</button><button class="ghost" id="setup">Change setup</button></div>' +
       '<p class="note">Scores here stay on your device. Model answers were drafted from the public Dash0 docs, pricing, and comparison pages in September 2026. Features marked new or rolling out change quickly, so use the source links and check with product marketing before relying on any claim.</p></div>';
  app.innerHTML = h;
  window.scrollTo(0,0);
  document.getElementById("again").onclick = startGame;
  document.getElementById("setup").onclick = renderStart;
}

renderStart();
</script>
</body>
</html>
